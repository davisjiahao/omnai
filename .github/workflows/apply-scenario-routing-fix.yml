name: Apply v0.1 green fixes

on:
  push:
    branches:
      - feat/omnai-v0.1
    paths:
      - .omnai-maintenance/scenario-routing-fix

permissions:
  contents: write

concurrency:
  group: omnai-v01-green-fixes
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/omnai-v0.1
          fetch-depth: 0

      - name: Apply scenario and safety corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  print(label, 'already applied')
                  return
              if old not in text:
                  raise SystemExit(f'{label}: expected text not found in {path}')
              p.write_text(text.replace(old, new))
              print(label, 'applied')

          # Readiness dimensions that were previously invisible to the router.
          replace(
              'src/domain/types.ts',
              "  frame: z.enum(READINESS_STATUSES).default('MISSING'),\n  research: z.enum(READINESS_STATUSES).default('MISSING'),\n  triage: z.enum(READINESS_STATUSES).default('MISSING'),",
              "  frame: z.enum(READINESS_STATUSES).default('MISSING'),\n  map: z.enum(READINESS_STATUSES).default('MISSING'),\n  research: z.enum(READINESS_STATUSES).default('MISSING'),\n  mitigation: z.enum(READINESS_STATUSES).default('MISSING'),\n  triage: z.enum(READINESS_STATUSES).default('MISSING'),",
              'readiness map/mitigation',
          )
          replace(
              'src/domain/types.ts',
              "  release: z.enum(READINESS_STATUSES).default('NOT_APPLICABLE'),\n  learning: z.enum(READINESS_STATUSES).default('MISSING'),",
              "  release: z.enum(READINESS_STATUSES).default('NOT_APPLICABLE'),\n  canary: z.enum(READINESS_STATUSES).default('MISSING'),\n  learning: z.enum(READINESS_STATUSES).default('MISSING'),",
              'readiness canary',
          )

          # Store initializes readiness from the scenario and scaffolds every artifact a required route needs.
          replace(
              'src/core/store.ts',
              "import { existsSync as existsSyncCompat } from 'node:fs';",
              "import { existsSync as existsSyncCompat, readFileSync } from 'node:fs';",
              'store readFileSync',
          )
          replace(
              'src/core/store.ts',
              "      frame: required('frame'),\n      research: required('research'),\n      triage: required('triage'),",
              "      frame: required('frame'),\n      map: required('map'),\n      research: required('research'),\n      mitigation: required('mitigate'),\n      triage: required('triage'),",
              'store readiness map/mitigation',
          )
          replace(
              'src/core/store.ts',
              "      release: scenario.stages.some((stage) => stage === 'ship' || stage === 'release') ? 'MISSING' : 'NOT_APPLICABLE',\n      learning: required('learn'),",
              "      release: scenario.stages.some((stage) => stage === 'ship' || stage === 'release') ? 'MISSING' : 'NOT_APPLICABLE',\n      canary: required('canary'),\n      learning: required('learn'),",
              'store readiness canary',
          )
          replace(
              'src/core/store.ts',
              "  if (['bug-fix', 'emergency-hotfix', 'performance-investigation', 'technical-experiment'].includes(scenario.id)) await ensureDir(join(root, 'experiments'));",
              "  if (scenario.stages.includes('experiment') || scenario.optionalStages.includes('experiment')) await ensureDir(join(root, 'experiments'));",
              'store experiment directory',
          )

          p = Path('src/core/store.ts')
          text = p.read_text()
          old = """  if (scenario.id === 'bug-fix' || scenario.id === 'emergency-hotfix') {\n    await writeTextAtomic(changeArtifactPath(repoRoot, directoryName, 'issue.md'), issueTemplate);\n    await writeYaml(changeArtifactPath(repoRoot, directoryName, 'issue.yaml'), createInitialIssueState());\n    await writeTextAtomic(changeArtifactPath(repoRoot, directoryName, 'fix.md'), fixTemplate);\n  }\n"""
          new = """  if (scenario.stages.some((stage) => ['triage', 'reproduce', 'debug'].includes(stage))) {\n    await writeTextAtomic(changeArtifactPath(repoRoot, directoryName, 'issue.md'), issueTemplate);\n    await writeYaml(changeArtifactPath(repoRoot, directoryName, 'issue.yaml'), createInitialIssueState());\n  }\n  if (scenario.stages.includes('fix')) {\n    await writeTextAtomic(changeArtifactPath(repoRoot, directoryName, 'fix.md'), fixTemplate);\n  }\n"""
          if new not in text:
              if old not in text:
                  raise SystemExit('store issue/fix artifact block not found')
              p.write_text(text.replace(old, new))
              print('store issue/fix artifacts applied')

          p = Path('src/core/store.ts')
          text = p.read_text()
          start = text.index('function discoverVerificationCommands(repoRoot: string): string[] {')
          replacement = r'''function discoverVerificationCommands(repoRoot: string): string[] {
  const commands: string[] = [];
  const packagePath = join(repoRoot, 'package.json');
  if (pathExistsSync(packagePath)) {
    try {
      const pkg = JSON.parse(readFileSync(packagePath, 'utf8')) as { scripts?: Record<string, unknown> };
      if (typeof pkg.scripts?.test === 'string' && pkg.scripts.test.trim()) commands.push('npm test');
    } catch {
      // Invalid package metadata is surfaced by the repository's own tooling; do not invent a test command.
    }
  }
  if (pathExistsSync(join(repoRoot, 'pom.xml'))) {
    if (pathExistsSync(join(repoRoot, 'mvnw'))) commands.push('./mvnw test');
    else if (pathExistsSync(join(repoRoot, 'mvnw.cmd'))) commands.push('mvnw.cmd test');
    else commands.push('mvn test');
  }
  if (pathExistsSync(join(repoRoot, 'build.gradle')) || pathExistsSync(join(repoRoot, 'build.gradle.kts'))) {
    if (pathExistsSync(join(repoRoot, 'gradlew'))) commands.push('./gradlew test');
    else if (pathExistsSync(join(repoRoot, 'gradlew.bat'))) commands.push('gradlew.bat test');
    else commands.push('gradle test');
  }
  if (pathExistsSync(join(repoRoot, 'pyproject.toml'))) {
    try {
      if (readFileSync(join(repoRoot, 'pyproject.toml'), 'utf8').toLowerCase().includes('pytest')) commands.push('pytest');
    } catch {
      // Ignore unreadable optional metadata.
    }
  }
  if (pathExistsSync(join(repoRoot, 'go.mod'))) commands.push('go test ./...');
  return commands;
}
function pathExistsSync(path: string): boolean { try { return Boolean(existsSyncCompat(path)); } catch { return false; } }
'''
          p.write_text(text[:start] + replacement)
          print('verification discovery applied')

          # Router and stage definitions now expose the missing readiness dimensions.
          replace(
              'src/core/readiness.ts',
              "  frame: 'frame',\n  research: 'research',\n  triage: 'triage',",
              "  frame: 'frame',\n  map: 'map',\n  research: 'research',\n  mitigate: 'mitigation',\n  triage: 'triage',",
              'router map/mitigation',
          )
          replace(
              'src/core/readiness.ts',
              "  release: 'release',\n  learn: 'learning',",
              "  release: 'release',\n  canary: 'canary',\n  learn: 'learning',",
              'router canary',
          )

          replace(
              'src/core/stages.ts',
              "import { randomUUID } from 'node:crypto';",
              "import { randomUUID } from 'node:crypto';\nimport { readdir } from 'node:fs/promises';",
              'stage directory inspection',
          )
          replace(
              'src/core/stages.ts',
              "import { buildEvidenceMatrix, selectReviewLenses } from './policy.js';",
              "import { buildEvidenceMatrix, selectReviewLenses } from './policy.js';\nimport { deliveryTemplate, designTemplate, domainTemplate, emptyTaskFile, fixTemplate, intentTemplate, issueTemplate, researchTemplate, specTemplate } from './templates.js';",
              'stage scaffold templates',
          )
          replace('src/core/stages.ts', "  map: { outputs: ['map.yaml'], context:", "  map: { outputs: ['map.yaml'], readiness: 'map', context:", 'stage map readiness')
          replace('src/core/stages.ts', "  mitigate: { outputs: ['research.md'], context:", "  mitigate: { outputs: ['research.md'], readiness: 'mitigation', context:", 'stage mitigation readiness')
          replace('src/core/stages.ts', "  canary: { outputs: ['evidence/canary.json'], context:", "  canary: { outputs: ['evidence/canary.json'], readiness: 'canary', context:", 'stage canary readiness')

          p = Path('src/core/stages.ts')
          text = p.read_text()
          old = """export async function completeStage(repoRoot: string, change: ChangeRef, capability: Capability): Promise<void> {\n  const definition = STAGES[capability];\n  for (const output of definition.outputs) {\n    if (output.endsWith('/')) continue;\n    const path = changeArtifactPath(repoRoot, change.directoryName, output);\n    if (!(await pathExists(path))) throw new Error(`Required output '${output}' is missing`);\n    const content = await readText(path);\n    if (!content.trim()) throw new Error(`Required output '${output}' is empty`);\n  }\n  if (capability === 'plan') await loadTasks(changeArtifactPath(repoRoot, change.directoryName, 'tasks.yaml'));\n  if (definition.readiness) await markReadiness(repoRoot, change, definition.readiness, 'READY');\n  await appendJsonLine(changeArtifactPath(repoRoot, change.directoryName, 'progress.jsonl'), {\n    timestamp: new Date().toISOString(), event: 'CAPABILITY_COMPLETED', changeId: change.metadata.id,\n    revision: change.metadata.activeRevision, detail: capability,\n  });\n}\n"""
          new = """export async function completeStage(repoRoot: string, change: ChangeRef, capability: Capability): Promise<void> {\n  const definition = STAGES[capability];\n  const scenario = getScenario(change.metadata.scenario);\n  for (const output of definition.outputs) {\n    const path = changeArtifactPath(repoRoot, change.directoryName, output);\n    if (output.endsWith('/')) {\n      if (!(await pathExists(path))) throw new Error(`Required output '${output}' is missing`);\n      const entries = await readdir(path, { withFileTypes: true });\n      if (!entries.some((entry) => entry.isFile())) throw new Error(`Required ${capability} output directory '${output}' contains no experiment record`);\n      continue;\n    }\n    if (!(await pathExists(path))) throw new Error(`Required output '${output}' is missing`);\n    const content = await readText(path);\n    if (!content.trim()) throw new Error(`Required output '${output}' is empty`);\n    const scaffold = initialScaffold(output, change, scenario);\n    if (scaffold !== null && content.trim() === scaffold.trim()) {\n      throw new Error(`Required output '${output}' is still the unchanged scaffold and is incomplete`);\n    }\n  }\n  if (capability === 'plan') {\n    const taskFile = await loadTasks(changeArtifactPath(repoRoot, change.directoryName, 'tasks.yaml'));\n    if (scenario.stages.includes('work') && taskFile.tasks.length === 0) throw new Error('Plan is incomplete: no implementation tasks were defined');\n  }\n  if (definition.readiness) await markReadiness(repoRoot, change, definition.readiness, 'READY');\n  await appendJsonLine(changeArtifactPath(repoRoot, change.directoryName, 'progress.jsonl'), {\n    timestamp: new Date().toISOString(), event: 'CAPABILITY_COMPLETED', changeId: change.metadata.id,\n    revision: change.metadata.activeRevision, detail: capability,\n  });\n}\n\nfunction initialScaffold(output: string, change: ChangeRef, scenario: ReturnType<typeof getScenario>): string | null {\n  switch (output) {\n    case 'intent.md': return intentTemplate(change.metadata.title, scenario);\n    case 'research.md': return researchTemplate;\n    case 'domain.md': return domainTemplate;\n    case 'spec.md': return specTemplate;\n    case 'design.md': return designTemplate;\n    case 'issue.md': return issueTemplate;\n    case 'fix.md': return fixTemplate;\n    case 'delivery.md': return deliveryTemplate;\n    case 'tasks.yaml': return emptyTaskFile;\n    default: return null;\n  }\n}\n"""
          if new not in text:
              if old not in text:
                  raise SystemExit('completeStage block not found')
              p.write_text(text.replace(old, new))
              print('completion gate applied')

          # Scenario routing: QA is conditional for generic hardening, while UI impact dynamically adds browser evidence.
          replace(
              'src/core/scenarios.ts',
              "    workMode: 'QUALITY', stages: ['research', 'review', 'qa', 'verify', 'learn'], optionalStages: ['plan', 'work', 'reconcile'], requiredArtifacts: ['research.md'],",
              "    workMode: 'QUALITY', stages: ['research', 'review', 'verify', 'learn'], optionalStages: ['qa', 'plan', 'work', 'reconcile'], requiredArtifacts: ['research.md'],",
              'quality hardening conditional QA',
          )
          replace(
              'src/core/scenarios.ts',
              "    gates: ['Quality findings are tied to an explicit contract or observed behavior', 'Fixes remain within the hardening scope'], requiredEvidence: ['review', 'tests', 'qa'],",
              "    gates: ['Quality findings are tied to an explicit contract or observed behavior', 'Fixes remain within the hardening scope'], requiredEvidence: ['review', 'tests'],",
              'quality hardening evidence',
          )
          replace(
              'src/core/scenarios.ts',
              "    requiredArtifacts: ['research.md', 'fix.md', 'tasks.yaml', 'delivery.md'], gates: ['Mitigation and root-cause correction are recorded separately', 'Emergency changes require explicit delivery approval'],",
              "    requiredArtifacts: ['issue.md', 'issue.yaml', 'research.md', 'fix.md', 'tasks.yaml', 'delivery.md'], gates: ['Mitigation and root-cause correction are recorded separately', 'Emergency changes require explicit delivery approval'],",
              'incident artifacts',
          )
          replace(
              'src/core/scenarios.ts',
              "    requiredArtifacts: ['research.md', 'fix.md', 'tasks.yaml', 'delivery.md'], gates: ['Promotion is paused before investigation', 'Rollback capability is checked instead of assumed'],",
              "    requiredArtifacts: ['issue.md', 'issue.yaml', 'research.md', 'fix.md', 'tasks.yaml', 'delivery.md'], gates: ['Promotion is paused before investigation', 'Rollback capability is checked instead of assumed'],",
              'release failure artifacts',
          )

          # Reconcile creates a new baseline and returns control to the first stale/invalidated normal capability.
          p = Path('src/core/reconcile.ts')
          text = p.read_text()
          start = text.index('const IMPACTS: Record<ReconcileLevel')
          end = text.index('\n\nexport interface ReconcileInput', start)
          replacement = """const IMPACTS: Record<ReconcileLevel, Array<keyof ChangeMetadata['readiness']>> = {\n  L0: ['implementation', 'review', 'verification', 'qa', 'release', 'canary', 'learning'],\n  L1: ['plan', 'implementation', 'review', 'verification', 'qa', 'release', 'canary', 'learning'],\n  L2: ['design', 'experiment', 'fix', 'plan', 'implementation', 'review', 'verification', 'qa', 'release', 'canary', 'learning'],\n  L3: ['domain', 'spec', 'design', 'experiment', 'fix', 'plan', 'implementation', 'review', 'verification', 'qa', 'release', 'canary', 'learning'],\n  L4: ['frame', 'map', 'research', 'mitigation', 'triage', 'reproduction', 'diagnosis', 'domain', 'spec', 'design', 'experiment', 'fix', 'plan', 'implementation', 'review', 'verification', 'qa', 'release', 'canary', 'learning'],\n  L5: ['review', 'verification', 'qa', 'release', 'canary'],\n};"""
          text = text[:start] + replacement + text[end:]
          text = text.replace("  change.metadata.status = 'NEEDS_RECONCILE';", "  change.metadata.status = 'IN_PROGRESS';")
          p.write_text(text)
          print('reconcile routing applied')

          # Host installation checks all collisions before any copy and can initialize itself when called directly.
          Path('src/core/host-skills.ts').write_text(r'''import { cp, readdir, readFile } from 'node:fs/promises';
import { existsSync } from 'node:fs';
import { dirname, join, resolve } from 'node:path';
import { fileURLToPath } from 'node:url';
import type { ProjectConfig } from '../domain/types.js';
import { ensureDir } from './files.js';
import { initializeProject, loadProjectConfig, saveProjectConfig } from './store.js';

export type SupportedHost = 'claude' | 'codex' | 'opencode';

const HOST_DIRECTORIES: Record<SupportedHost, string> = {
  claude: '.claude/skills',
  codex: '.codex/skills',
  opencode: '.opencode/skills',
};

export async function installHostSkills(repoRoot: string, host: SupportedHost): Promise<string[]> {
  const sourceRoot = locateSkillsRoot();
  const destinationRoot = join(repoRoot, HOST_DIRECTORIES[host]);
  const entries = (await readdir(sourceRoot, { withFileTypes: true }))
    .filter((entry) => entry.isDirectory() && existsSync(join(sourceRoot, entry.name, 'SKILL.md')));

  for (const entry of entries) {
    const destination = join(destinationRoot, entry.name);
    if (!existsSync(destination)) continue;
    const skillPath = join(destination, 'SKILL.md');
    if (!existsSync(skillPath)) throw new Error(`Refusing to overwrite existing foreign skill directory '${destination}'`);
    const content = await readFile(skillPath, 'utf8');
    const name = /^name:\s*([^\r\n]+)$/m.exec(content)?.[1]?.trim();
    if (name !== entry.name || !/^# OmnAI\b/m.test(content)) {
      throw new Error(`Refusing to overwrite existing foreign skill '${destination}'`);
    }
  }

  await initializeProject(repoRoot);
  await ensureDir(destinationRoot);
  const installed: string[] = [];
  for (const entry of entries) {
    const source = join(sourceRoot, entry.name);
    const destination = join(destinationRoot, entry.name);
    await cp(source, destination, { recursive: true, force: true });
    installed.push(destination);
  }

  const config = await loadProjectConfig(repoRoot);
  const installedHosts: ProjectConfig['installedHosts'] = [...new Set([...config.installedHosts, host])];
  await saveProjectConfig(repoRoot, { ...config, installedHosts });
  return installed;
}

export function locateSkillsRoot(): string {
  const currentFile = fileURLToPath(import.meta.url);
  const candidates = [
    resolve(dirname(currentFile), '../../skills'),
    resolve(dirname(currentFile), '../../../skills'),
    resolve(process.cwd(), 'skills'),
  ];
  const match = candidates.find((candidate) => existsSync(join(candidate, 'omnai', 'SKILL.md')));
  if (!match) throw new Error(`Unable to locate packaged OmnAI skills. Checked: ${candidates.join(', ')}`);
  return match;
}
''')
          print('host skill collision protection applied')
          PY

          mkdir -p skills/omnai-reproduce skills/omnai-simplify skills/omnai-mitigate skills/omnai-canary skills/omnai-archive
          cat > skills/omnai-reproduce/SKILL.md <<'EOF'
          ---
          name: omnai-reproduce
          description: Establish deterministic bug reproduction or a concrete instrumentation plan before diagnosis or fixing.
          ---

          # OmnAI Reproduce

          1. Run `omnai reproduce "<symptom>"` for the active bug-oriented change.
          2. Capture exact preconditions, inputs, environment, expected behavior, actual behavior, and evidence.
          3. Prefer the smallest deterministic reproducer; if that is impossible, define instrumentation that can falsify hypotheses.
          4. Update `issue.md` and `issue.yaml`; do not edit production code.
          5. Complete the capability only when reproduction is confirmed or an explicit instrumentation route is recorded.
          EOF
          cat > skills/omnai-simplify/SKILL.md <<'EOF'
          ---
          name: omnai-simplify
          description: Simplify an implemented diff without changing behavior before independent review.
          ---

          # OmnAI Simplify

          1. Work only on the active task's diff and preserve observable behavior.
          2. Remove accidental complexity, duplication, dead branches, and unnecessary abstractions only when evidence shows they are safe.
          3. Do not expand scope or redesign unrelated code.
          4. Re-run the relevant verification after simplification and record fresh evidence.
          EOF
          cat > skills/omnai-mitigate/SKILL.md <<'EOF'
          ---
          name: omnai-mitigate
          description: Reduce active production impact before root-cause correction while preserving evidence and reversibility.
          ---

          # OmnAI Mitigate

          1. Use for `incident-response` and `release-failure` before normal diagnosis.
          2. Choose the smallest reversible action that reduces customer or operational impact.
          3. Preserve logs, traces, versions, timestamps, and other evidence before destructive actions.
          4. Record action, reversibility, side effects, remaining impact, owner, and evidence in `research.md`.
          5. Mitigation is not root-cause completion; continue through research/debug/fix after impact is controlled.
          EOF
          cat > skills/omnai-canary/SKILL.md <<'EOF'
          ---
          name: omnai-canary
          description: Evaluate a released or activated change during a bounded observation window using explicit technical and business thresholds.
          ---

          # OmnAI Canary

          1. Run only after delivery readiness and activation prerequisites are satisfied.
          2. Define observation window, technical metrics, business metrics, thresholds, and rollback/pause criteria before interpreting results.
          3. Record anomalies and evidence in `evidence/canary.json`.
          4. End with an explicit continue, pause, or rollback recommendation; never infer health from absence of alerts alone.
          EOF
          cat > skills/omnai-archive/SKILL.md <<'EOF'
          ---
          name: omnai-archive
          description: Archive a verified change while preserving revisions, evidence, and knowledge lineage.
          ---

          # OmnAI Archive

          1. Run `omnai status` and confirm required tasks, verification, review, delivery, and scenario evidence are satisfied.
          2. Do not use `--force` to hide unresolved evidence except for an explicitly documented human waiver.
          3. Run `omnai archive` only after canonical artifacts agree with the active revision and baseline.
          4. Preserve the full `.omnai/changes/<change>` history; archive is a lifecycle state, not deletion.
          EOF

          # Remove one-shot maintenance machinery after it has served its purpose.
          rm -f .omnai-maintenance/scenario-routing-fix .omnai-maintenance/finalize-v0.1
          rm -f .github/workflows/apply-scenario-routing-fix.yml .github/workflows/finalize-v0.1.yml .github/workflows/finalize-v01.yml
          rmdir .omnai-maintenance 2>/dev/null || true

      - name: Verify full v0.1 gate
        shell: bash
        run: |
          set -euo pipefail
          npm install
          npm run typecheck
          npm test
          npm run build
          npm pack --dry-run
          git diff --check

      - name: Commit green fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close v0.1 scenario and safety gates"
          git push origin HEAD:feat/omnai-v0.1
