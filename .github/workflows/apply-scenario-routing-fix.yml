name: Apply v0.1 green fixes

on:
  push:
    branches:
      - feat/omnai-v0.1
    paths:
      - .omnai-maintenance/scenario-routing-fix

permissions:
  contents: write

concurrency:
  group: omnai-v01-green-fixes
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/omnai-v0.1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source fixes
        run: python scripts/apply-green-fixes.py
      - name: Verify full v0.1 gate
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build
          npm pack --dry-run
          git diff --check
      - name: Commit verified fixes
        run: |
          rm -f .omnai-maintenance/scenario-routing-fix .omnai-maintenance/finalize-v0.1
          rm -f .github/workflows/apply-scenario-routing-fix.yml .github/workflows/finalize-v0.1.yml .github/workflows/finalize-v01.yml
          rm -f scripts/apply-green-fixes.py
          rmdir .omnai-maintenance 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close v0.1 scenario and safety gates"
          git push origin HEAD:feat/omnai-v0.1
