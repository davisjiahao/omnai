name: Bootstrap OmnAI source

on:
  push:
    branches:
      - feat/omnai-v0.1

permissions:
  contents: write

concurrency:
  group: omnai-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/omnai-v0.1
          fetch-depth: 0

      - name: Check bootstrap payload
        id: payload
        shell: bash
        run: |
          set -euo pipefail
          ready=true
          for part in $(seq -w 0 14); do
            if [[ ! -f ".omnai-bootstrap/part-${part}" ]]; then
              ready=false
            fi
          done
          echo "ready=${ready}" >> "$GITHUB_OUTPUT"

      - name: Restore source tree
        if: steps.payload.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .omnai-bootstrap/part-* | base64 --decode > /tmp/omnai-source.tar.gz
          echo "0518db6255f88bf0aa939d11e7786900adfbbb01e78a9e811d4a8e2481d2dc7e  /tmp/omnai-source.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/omnai-source.tar.gz
          rm -rf .omnai-bootstrap
          rm -f .github/workflows/bootstrap-source.yml

      - name: Commit restored source
        if: steps.payload.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "feat: implement OmnAI v0.1 native workflow"
          git push origin HEAD:feat/omnai-v0.1
