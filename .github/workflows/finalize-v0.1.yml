name: Finalize OmnAI v0.1

on:
  push:
    branches:
      - feat/omnai-v0.1
    paths:
      - .omnai-maintenance/finalize-v0.1

permissions:
  contents: write

concurrency:
  group: omnai-v0.1-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/omnai-v0.1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Normalize remaining issue gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/core/issues.ts')
          text = path.read_text()
          if 'Issue is not ready for fix:' in text:
              print('aggregate issue gate already present')
          else:
              old = """  if (next === 'ready-for-fix') {\n    if (issue.reproduction !== 'confirmed') throw new Error('Confirmed reproduction is required before a fix.');\n    if (issue.rootCause !== 'confirmed') throw new Error('Confirmed root cause is required before a fix.');\n    if (issue.fixStrategy !== 'ready') throw new Error('Fix strategy must be ready before a fix.');\n  }\n"""
              new = """  if (next === 'ready-for-fix') {\n    const missing: string[] = [];\n    if (issue.reproduction !== 'confirmed') missing.push('confirmed reproduction');\n    if (issue.rootCause !== 'confirmed') missing.push('confirmed root cause');\n    if (issue.fixStrategy !== 'ready') missing.push('ready fix strategy');\n    if (missing.length > 0) throw new Error(`Issue is not ready for fix: ${missing.join(', ')}.`);\n  }\n"""
              if old not in text:
                  raise SystemExit('ready-for-fix block does not match supported shapes')
              path.write_text(text.replace(old, new))
          PY

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package dry-run
        run: npm pack --dry-run

      - name: Diff check
        run: git diff --check

      - name: Verify v0.1 inventory
        shell: bash
        run: |
          set -euo pipefail
          test "$(find docs/scenarios -maxdepth 1 -name '*.md' ! -name README.md | wc -l | tr -d ' ')" -eq 19
          for skill in \
            omnai omnai-investigate omnai-frame omnai-research omnai-model omnai-map omnai-spec omnai-design omnai-plan \
            omnai-triage omnai-reproduce omnai-debug omnai-experiment omnai-fix omnai-work omnai-simplify omnai-review \
            omnai-verify omnai-qa omnai-mitigate omnai-ship omnai-canary omnai-learn omnai-reconcile omnai-archive; do
            test -f "skills/${skill}/SKILL.md"
          done
          golden="examples/golden/java-authorization-migration/.omnai/changes/CHG-0001-authorization-migration"
          for file in change.yaml research.md domain.md spec.md contract.md design.md tasks.yaml revisions/REV-0002.yaml evidence/EVD-002.yaml delivery.md; do
            test -f "${golden}/${file}"
          done

      - name: Record verified base
        shell: bash
        run: |
          set -euo pipefail
          base_sha=$(git rev-parse HEAD)
          mkdir -p docs/status
          cat > docs/status/v0.1-verification.md <<EOF
          # OmnAI v0.1 Verification

          Verified source commit: \`${base_sha}\`

          The v0.1 finalizer executed successfully on GitHub Actions with Node.js 20 and ran:

          - \`npm install\`
          - \`npm run typecheck\`
          - \`npm test\`
          - \`npm run build\`
          - \`npm pack --dry-run\`
          - \`git diff --check\`
          - inventory checks for 19 canonical scenarios, the required native host-skill surface, and the Java authorization-migration golden example

          This file is written only after every command above exits successfully. The final metadata commit only records this evidence and removes one-shot maintenance files.
          EOF

      - name: Remove one-shot maintenance files
        shell: bash
        run: |
          rm -f .omnai-maintenance/finalize-v0.1
          rm -f .omnai-maintenance/issue-gate-fix
          rm -f .github/workflows/finalize-v0.1.yml
          rm -f .github/workflows/apply-issue-gate-fix.yml
          rmdir .omnai-maintenance 2>/dev/null || true

      - name: Commit verified state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: record OmnAI v0.1 verification"
          git push origin HEAD:feat/omnai-v0.1
